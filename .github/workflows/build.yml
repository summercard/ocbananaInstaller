# Build OCBanana

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            os_name: windows
            ext: .exe
            arch: x64
          - os: macos-latest
            os_name: macos
            ext: .app
            arch: arm64
          - os: macos-12
            os_name: macos-intel
            ext: .app
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: 构建 Windows 版本
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --name=OCBanana --windowed --onefile --clean --noconfirm simple_installer.py
        cd dist
        mv OCBanana.exe OCBanana-Windows-x64.exe

    - name: 构建 macOS 版本
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --name=OCBanana --windowed --onefile --clean --noconfirm simple_installer.py
        cd dist
        ls -la
        if [ -f "OCBanana.app" ]; then
          zip -r OCBanana-macOS-arm64.zip OCBanana.app
        else
          zip -r OCBanana-macOS-arm64.zip OCBanana
        fi

    - name: 构建 macOS Intel 版本
      if: matrix.os == 'macos-12'
      run: |
        pyinstaller --name=OCBanana --windowed --onefile --clean --noconfirm simple_installer.py
        cd dist
        ls -la
        if [ -f "OCBanana.app" ]; then
          zip -r OCBanana-macOS-x64.zip OCBanana.app
        else
          zip -r OCBanana-macOS-x64.zip OCBanana
        fi

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: OCBanana-${{ matrix.os_name }}
        path: dist/*
        retention-days: 30
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
    - name: 下载所有构建产物
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: 显示文件列表
      run: ls -R artifacts

    - name: 创建 Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/OCBanana-windows/OCBanana-Windows-x64.exe
          artifacts/OCBanana-macos/OCBanana-macOS-arm64.zip
          artifacts/OCBanana-macos-intel/OCBanana-macOS-x64.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
